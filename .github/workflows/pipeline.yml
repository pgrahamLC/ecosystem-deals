name: Development pipeline

on:
  schedule:
    - cron: '15 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh the public planning pipeline
        run: node scripts/refresh-pipeline.mjs
      - name: Check the pipeline file
        run: node scripts/pipeline-model.test.mjs
      - name: Commit the weekly snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/market-entry/pipeline.json
          if git diff --cached --quiet; then echo 'No pipeline change'; exit 0; fi
          git commit -m 'Refresh the public development pipeline'
          git push origin "HEAD:${GITHUB_REF_NAME}"
