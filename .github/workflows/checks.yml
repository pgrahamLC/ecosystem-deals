name: Page checks

on:
  pull_request:
  push:
    paths:
      - 'plan2/**'
      - 'scripts/land-registry/**'
      - '.github/workflows/checks.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Score and council-lease tests
        run: |
          node --test plan2/match-model.test.js
          node --test scripts/land-registry/*.test.mjs
