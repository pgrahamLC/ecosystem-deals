name: Collect auction lots

on:
  schedule:
    # Every six hours. GitHub may start a scheduled run late.
    - cron: '15 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-auctions
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read public catalogues
        run: node scripts/collect-auctions.mjs
      - name: Commit the catalogue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/auctions
          if git diff --staged --quiet; then
            echo "No change in the catalogue"
          else
            git commit -m "Update auction lots"
            git push
          fi
